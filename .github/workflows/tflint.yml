name: TFLint

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  tflint_version: v0.54.0

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tflint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      name: Checkout source code

    - uses: actions/cache@b7e8d49f17405cc70c1c120101943203c98d3a4b # v4
      name: Cache plugin dir
      with:
        path: ~/.tflint.d/plugins
        key: ubuntu-latest-tflint-${{ hashFiles('.tflint.hcl') }}

    - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v4
      name: Setup TFLint
      with:
        tflint_version:  ${{ env.tflint_version }}

    - name: Init TFLint
      run: tflint --init

    - name: Run TFLint against modules
      run: |
        #!/usr/bin/env bash

        ROOT_DIR=$GITHUB_WORKSPACE
        TFLINT_CONFIG_FILE="$ROOT_DIR/.tflint.hcl"
        MODULES_DIR="$ROOT_DIR/infra/terragrunt/modules"

        for module_dir in $(find "$MODULES_DIR" -maxdepth 5 -type d); do
          echo "Running tflint at: $module_dir"
          pushd "$module_dir" >/dev/null
            TFLINT_CONFIG_FILE="$TFLINT_CONFIG_FILE" tflint --recursive
          popd >/dev/null
        done

